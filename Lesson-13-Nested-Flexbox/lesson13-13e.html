<!DOCTYPE html>
<html>
  <head>
    <title>Lesson 13 - Nested Flexbox </title>
    <link rel="stylesheet" href="lesson13-13e.css">
  </head>
  <body>
    <div class="flex-box">
      <div class="header">ALL INBOXES</div>
      <div class="container-of-email">
        <div class="profile-picture">
          <img class="profile-image" src="FELV-cat.jpg">
        </div>
        <div class="email-content">
          <div class="shared-row">
            <div class="title-of-email">Chewy Promotions</div>
            <div class="time-stamp">4:58 PM</div>
          </div>
          <div class="sub-title">Biggest sales of the year!</div>
          <div class="preview-of-email">Hey there! We're writing to tell you about our...</div>
        </div>
      </div>

      <div class="container-of-email">
        <div class="profile-picture">
          <img class="profile-image" src="image-83814-800.jpg">
        </div>
        <div class="email-content">
          <div class="shared-row">
            <div class="title-of-email">Best Buy</div>
            <div class="time-stamp">12:32 PM</div>
          </div>
          <div class="sub-title">Your Best Buy eReceipt</div>
          <div class="preview-of-email">Thank you for shopping at Best Buy, here is...</div>
        </div>
      </div>

      <div class="container-of-email">
        <div class="profile-picture">
          <img class="profile-image" src="Golden+Retrievers+dans+pet+care.webp">
        </div>
        <div class="email-content">
          <div class="shared-row">
            <div class="title-of-email">Netflix</div>
            <div class="time-stamp">9:00 AM</div>
          </div>
          <div class="sub-title">Here's what's coming soon to Netflix</div>
          <div class="preview-of-email">Brand new movies and shows, old favorites...</div>
        </div>
      </div>

    </div>
  </body>
</html>
